<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 热点资讯 - AI News</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <h1>AI 热点资讯</h1>
            </div>
            <p class="subtitle">每日 AI 新闻精选</p>
            <div class="update-time" id="updateTime"></div>
        </header>

        <!-- 分类标签 -->
        <div class="filter-tabs">
            <button class="tab-btn active" data-category="all">全部</button>
            <button class="tab-btn" data-category="大模型">大模型</button>
            <button class="tab-btn" data-category="应用">应用</button>
            <button class="tab-btn" data-category="学术">学术</button>
            <button class="tab-btn" data-category="产品">产品</button>
        </div>

        <!-- 新闻列表 -->
        <main class="news-list" id="newsList">
            <!-- 新闻卡片会动态插入 -->
        </main>

        <!-- 加载更多 -->
        <div class="load-more">
            <button id="loadMoreBtn" class="load-more-btn">加载更多</button>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 AI 热点资讯 | 每日更新</p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
